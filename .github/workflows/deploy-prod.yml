name: Deploy to Production

# Never on push. Production ships when a person decides it ships.
#
# The `production` GitHub Environment carries required reviewers, and the
# AWS trust policy is pinned to `environment:production` — so AWS will not
# issue a credential at all until a human has approved the run.
on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run prisma migrate deploy (a pre-deploy snapshot is always taken first)"
        type: boolean
        default: true
      ref:
        description: "Branch, tag or SHA to deploy"
        type: string
        default: production

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never abandon a half-finished production deploy

env:
  AWS_REGION: us-west-1
  ASG_NAME: sc-prod-app-asg
  DB_IDENTIFIER: sc-prod-rds-pg

permissions:
  id-token: write # request the OIDC token
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # No AWS access keys exist in this repository. The role is assumed with
      # a short-lived OIDC token scoped to this repo AND this environment.
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::372110294387:role/sc-prod-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      # The rollback. Prisma migrations do not reverse themselves, so a
      # snapshot taken BEFORE the migration is the only way back from a bad
      # one. Taken unconditionally: the cheapest insurance in the pipeline.
      - name: Pre-deploy snapshot
        run: |
          SNAP="sc-prod-presnap-$(echo '${{ steps.sha.outputs.sha }}' | cut -c1-8)-$(date -u +%Y%m%d%H%M)"
          echo "Creating $SNAP"
          aws rds create-db-snapshot \
            --db-instance-identifier "$DB_IDENTIFIER" \
            --db-snapshot-identifier "$SNAP" \
            --tags Key=Environment,Value=prod Key=Project,Value=spiritual-california
          aws rds wait db-snapshot-available --db-snapshot-identifier "$SNAP"
          echo "SNAPSHOT=$SNAP" >> "$GITHUB_ENV"
          echo "Snapshot ready. Restore target if this deploy goes wrong."

      - name: Find instances
        id: targets
        run: |
          IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)
          [ -n "$IDS" ] || { echo "No in-service instances"; exit 1; }
          echo "Deploying to: $IDS"
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      # The script is read from the checked-out repo, so it always matches
      # the commit being deployed rather than drifting on the instance.
      - name: Deploy
        run: |
          # The script is base64'd rather than embedded as text.
          #
          # It has to survive bash -> JSON -> the AWS CLI -> dash on the
          # instance, and a shell script is full of exactly the characters
          # each of those layers treats specially: quotes, $(), backslashes,
          # newlines. Passing it as a heredoc failed with a syntax error
          # pointing at a "(" that was never meant to be interpreted at all.
          #
          # Base64 is [A-Za-z0-9+/=] and a single line, so nothing in it means
          # anything to any layer in between.
          SCRIPT_B64=$(base64 -w0 infra/scripts/deploy-on-instance.sh)
          FIRST=true

          for ID in ${{ steps.targets.outputs.ids }}; do
            echo "::group::$ID"

            # Migrations run once, from the first instance only. Concurrent
            # `migrate deploy` would contend on Prisma's advisory lock — safe,
            # but still a bug worth not having.
            RUN_MIG="false"
            if [ "$FIRST" = "true" ] && [ "${{ inputs.run_migrations }}" = "true" ]; then
              RUN_MIG="true"
            fi

            # SSM runs the commands array under /bin/sh, which is dash on
            # Ubuntu and NOT bash. `set -o pipefail` is a bash builtin that
            # dash rejects outright, killing the command before a line runs,
            # so the wrapper uses POSIX `set -eu`. The deploy script itself is
            # bash, keeps its own `set -euo pipefail`, and is invoked
            # explicitly with `bash`, so its options apply normally.
            #
            # Comments must stay OUT of the backslash continuation below: a
            # `\` continues to the next line, and a comment line breaks the
            # chain so the following argument is parsed as its own command.
            # Staged in /opt/sc-deploy, deliberately NOT /tmp.
            #
            # /tmp is world-writable and sticky (1777), and Ubuntu enables
            # fs.protected_regular by default: writing to an EXISTING file
            # there that is owned by another user is refused — for root too.
            # Since the script is chowned to ubuntu after the first deploy,
            # every subsequent deploy then failed with "cannot create
            # /tmp/deploy.sh: Permission denied" while running as root.
            #
            # /opt is root-owned and not world-writable, so the protection
            # does not apply.
            #
            # Built with jq into a JSON file so the shell never has to quote
            # it, and passed by reference. Every failure here so far came
            # from a shell or filesystem layer, not from the deploy itself.
            jq -n \
              --arg b64 "$SCRIPT_B64" \
              --arg sha "${{ steps.sha.outputs.sha }}" \
              --arg mig "$RUN_MIG" \
              '{
                 commands: [
                   "set -eu",
                   "mkdir -p /opt/sc-deploy",
                   ("echo " + $b64 + " | base64 -d > /opt/sc-deploy/deploy.sh"),
                   "chown ubuntu:ubuntu /opt/sc-deploy/deploy.sh",
                   ("sudo -u ubuntu -H env TARGET_SHA=" + $sha
                     + " RUN_MIGRATIONS=" + $mig
                     + " REGION=us-west-1 bash /opt/sc-deploy/deploy.sh")
                 ]
               }' > /tmp/ssm-params.json

            CMD=$(aws ssm send-command \
              --instance-ids "$ID" \
              --document-name AWS-RunShellScript \
              --comment "deploy ${{ steps.sha.outputs.sha }}" \
              --timeout-seconds 2400 \
              --parameters file:///tmp/ssm-params.json \
              --query "Command.CommandId" --output text)

            echo "SSM command $CMD"

            # Polled manually rather than with `aws ssm wait
            # command-executed`, whose built-in waiter gives up after roughly
            # 100 seconds (20 attempts x 5s) and cannot be extended. A deploy
            # here runs npm ci twice and two builds, comfortably past ten
            # minutes, so the waiter reported failure on a command that was
            # still working — and the deploy carried on unsupervised.
            #
            # 30 minutes, matched to the SendCommand timeout above.
            # 15s x 120 = 30 minutes, matching the SendCommand timeout.
            #
            # Polling less often is deliberate: at 10s this loop could issue
            # ~180 GetCommandInvocation calls, and SSM throttling then made a
            # LATER call fail — turning a successful deploy red.
            #
            # `|| echo Pending` keeps a transient API error from being read as
            # a terminal state and abandoning a running deploy.
            STATUS="Pending"
            for _ in $(seq 1 120); do
              STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" \
                --query "Status" --output text 2>/dev/null || echo "Pending")
              case "$STATUS" in
                Success)                    break ;;
                Failed|Cancelled|TimedOut)  break ;;
              esac
              sleep 15
            done
            echo "final status: $STATUS"

            if [ "$STATUS" != "Success" ]; then
              echo "::error::Deploy failed on $ID (status: $STATUS)"
              aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" \
                --query "StandardErrorContent" --output text || true
              aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" \
                --query "StandardOutputContent" --output text | tail -60 || true
              echo "Restore point: $SNAPSHOT"
              exit 1
            fi

            # Purely informational, and therefore MUST NOT be able to fail the
            # step. This exact call is what turned a successful deploy red:
            # the AWS CLI returned 254 (most likely throttling after the poll
            # loop) and `bash -e` aborted, long after the deploy itself had
            # completed on the instance.
            #
            # A logging call should never decide the outcome of a deploy.
            {
              aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" \
                --query "StandardOutputContent" --output text 2>/dev/null | tail -40
            } || echo "(could not retrieve deploy log - the deploy itself SUCCEEDED)"

            echo "::endgroup::"
            FIRST=false
          done

      # Written after success so a replacement instance launched later
      # bootstraps to the code that is actually running, rather than to
      # whatever the AMI happened to contain.
      - name: Record deployed commit
        run: |
          aws ssm put-parameter \
            --name /sc/prod/app/target-sha \
            --description "Commit currently deployed to production." \
            --type String --overwrite \
            --value "${{ steps.sha.outputs.sha }}"

      # Verified through the load balancer, not just on the instance: this is
      # the first check that exercises the target groups and listener rules
      # rather than localhost.
      - name: Verify through the load balancer
        run: |
          ALB=$(aws elbv2 describe-load-balancers --names sc-prod-alb \
            --query "LoadBalancers[0].DNSName" --output text)

          for i in $(seq 1 30); do
            WEB=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://$ALB/healthz" || echo 000)
            API=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://$ALB/api/v1/health/live" || echo 000)
            if [ "$WEB" = "200" ] && [ "$API" = "200" ]; then
              echo "Load balancer serving both apps."

              # The /api/* collision guard. Priority 10 must send this to
              # Next.js; if it reaches NestJS the response is a Nest-shaped
              # 404 and CMS revalidation is silently broken.
              REVAL=$(curl -s --max-time 10 -X POST -H 'Content-Type: application/json' \
                -d '{}' "http://$ALB/api/revalidate-static-page" || echo '')
              case "$REVAL" in
                *Unauthorized*|*secret*|*slug*)
                  echo "Revalidate route correctly reaches Next.js." ;;
                *"Cannot POST"*)
                  echo "::error::/api/revalidate-static-page is hitting NestJS — listener rule priority 10 is wrong."
                  exit 1 ;;
                *)
                  echo "::warning::Unexpected revalidate response: $REVAL" ;;
              esac
              exit 0
            fi
            echo "  web=$WEB api=$API — retrying"
            sleep 10
          done

          echo "::error::Load balancer never returned healthy. Restore point: $SNAPSHOT"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ steps.sha.outputs.sha }}\` |"
            echo "| Ref | \`${{ inputs.ref }}\` |"
            echo "| Migrations | ${{ inputs.run_migrations }} |"
            echo "| Snapshot | \`$SNAPSHOT\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
